<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Delivery Service</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:#f8f9fa;
        font-family:Arial, sans-serif;
    }

    /* HEADER */
    header{
        background:#ff5722;
        color:white;
        padding:15px 0;
    }

    .nav-links a{
        color:white;
        text-decoration:none;
        margin-left:20px;
        font-weight:bold;
    }

    .nav-links a:hover{
        text-decoration:underline;
    }

    /* MAIN SECTION */
    .main-section{
        padding:60px 0;
    }

    .food-img{
        width:100%;
        border-radius:10px;
    }

    /* FOOTER */
    footer{
        background:#212529;
        color:white;
        text-align:center;
        padding:15px;
        margin-top:40px;
    }

</style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="row align-items-center">

                <!-- BRAND -->
                <div class="col-6">
                    <h2>FoodExpress</h2>
                </div>

                <!-- NAVIGATION -->
                <div class="col-6 text-end nav-links">
                    <a href="#">Home</a>
                    <a href="#">Contact</a>
                </div>

            </div>
        </div>
    </header>

    <!-- MAIN SECTION -->
    <section class="main-section">
        <div class="container">

            <div class="row align-items-center">

                <!-- LEFT COLUMN -->
                <div class="col-md-8 mb-4">
                    <h1>Welcome to FoodExpress</h1>

                    <p>
                        We deliver fresh and delicious meals right to your
                        doorstep. Enjoy fast delivery, quality food, and
                        excellent customer service anytime you want.
                    </p>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="col-md-4">
                    <img 
                    src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1000&auto=format&fit=crop" 
                    alt="Food Image"
                    class="food-img">
                </div>

            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 FoodExpress. All Rights Reserved.</p>
    </footer>

</body>
</html>
