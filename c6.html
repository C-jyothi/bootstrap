<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Website Feedback Form</h2>

    <form>

        <!-- Name -->
        <div class="form-group">
            <label for="name">Name</label>

            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Enter your name">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>

            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Enter your email">
        </div>

        <!-- Feedback Message -->
        <div class="form-group">
            <label for="feedback">Feedback</label>

            <textarea class="form-control"
                      id="feedback"
                      rows="4"
                      placeholder="Write your feedback here"></textarea>
        </div>

        <!-- Dropdown -->
        <div class="form-group">
            <label for="source">How did you find our website?</label>

            <select class="form-control" id="source">
                <option>Google Search</option>
                <option>Social Media</option>
                <option>Friend Recommendation</option>
                <option>YouTube</option>
                <option>Other</option>
            </select>
        </div>

        <!-- Satisfaction Level -->
        <div class="form-group">
            <label>Satisfaction Level</label>

            <div class="form-check">
                <input type="radio"
                       class="form-check-input"
                       id="rate1"
                       name="rating">

                <label class="form-check-label" for="rate1">
                    1
                </label>
            </div>

            <div class="form-check">
                <input type="radio"
                       class="form-check-input"
                       id="rate2"
                       name="rating">

                <label class="form-check-label" for="rate2">
                    2
                </label>
            </div>

            <div class="form-check">
                <input type="radio"
                       class="form-check-input"
                       id="rate3"
                       name="rating">

                <label class="form-check-label" for="rate3">
                    3
                </label>
            </div>

            <div class="form-check">
                <input type="radio"
                       class="form-check-input"
                       id="rate4"
                       name="rating">

                <label class="form-check-label" for="rate4">
                    4
                </label>
            </div>

            <div class="form-check">
                <input type="radio"
                       class="form-check-input"
                       id="rate5"
                       name="rating">

                <label class="form-check-label" for="rate5">
                    5
                </label>
            </div>

        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">
            Submit Feedback
        </button>

    </form>

</div>

</body>
</html>
